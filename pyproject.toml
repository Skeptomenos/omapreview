[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omepreview"
version = "0.1.1"
description = "Preview-style PDF viewer and reviewer for Linux"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Peter Bergin" }]
keywords = ["pdf", "annotation", "signature", "agent", "mcp", "omarchy"]
dependencies = [
  "pymupdf>=1.24",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest", "mcp>=1.2"]

[project.scripts]
omepreview = "omepreview.cli:main"
omapreview = "omepreview.cli:main"
omepreview-mcp = "omepreview.mcp_entry:main"
omapreview-mcp = "omepreview.mcp_entry:main"

[project.urls]
Homepage = "https://github.com/Skeptomenos/omapreview"

[tool.hatch.build.targets.wheel]
packages = ["src/omepreview"]
